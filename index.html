<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>3D Model Viewer mit Metallischem Material</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="three.js"></script>
  <script src="Detector.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="OBJLoader.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111;
      touch-action: none;
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body>
<script>
  if (!Detector.webgl) Detector.addGetWebGLMessage();

  let container, camera, controls, scene, renderer;

  init();
  animate();

  function init() {
    container = document.createElement('div');
    document.body.appendChild(container);

    // Kamera
    camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 3;

    // Szene
    scene = new THREE.Scene();

    // Licht: gedimmtes PointLight + DirectionalLight
    const pointLight = new THREE.PointLight(0xffffff, 0.6);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.3);
    directionalLight.position.set(-3, 10, -10);
    scene.add(directionalLight);

    // Renderer
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // Controls mit Zoom (funktioniert auch mobil)
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.1;
    controls.enableZoom = true;
    controls.minDistance = 0.5;
    controls.maxDistance = 10;

    // Modell laden und graues metallisches Material setzen
    const loader = new THREE.OBJLoader();
    loader.setPath('assets/');
    loader.load('model.obj', function(object) {
      // Material definieren
      const material = new THREE.MeshStandardMaterial({
        color: 0x888888,
        metalness: 0.5,
        roughness: 0.4,
      });

      // Material auf alle Meshes anwenden
      object.traverse(function(child) {
        if (child.isMesh) {
          child.material = material;
        }
      });

      scene.add(object);
    });

    window.addEventListener('resize', onWindowResize, false);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
</script>
</body>
</html>
