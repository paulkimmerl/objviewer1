<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wandernde PointLights - 3D Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="three.js"></script>
  <script src="Detector.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="OBJLoader.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111;
      touch-action: none;
    }
  </style>
</head>
<body>

<script>
if (!Detector.webgl) Detector.addGetWebGLMessage();

let container, camera, controls, scene, renderer;
let light1, light2, light3;
let time = 0;

init();
animate();

function init() {
  container = document.createElement('div');
  document.body.appendChild(container);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 3;

  scene = new THREE.Scene();

  // Wandernde Punktlichter
  light1 = new THREE.PointLight(0xff0040, 0.8, 50);
  scene.add(light1);

  light2 = new THREE.PointLight(0x0040ff, 0.8, 50);
  scene.add(light2);

  light3 = new THREE.PointLight(0x40ff00, 0.8, 50);
  scene.add(light3);

  // Modell laden
  const loader = new THREE.OBJLoader();
  loader.setPath('assets/');
  loader.load('model.obj', function (object) {
    scene.add(object);
  });

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  // Controls
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.1;
  controls.enableZoom = true;

  window.addEventListener('resize', onWindowResize, false);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  time += 0.01;

  // Positionen animieren (Wanderbewegung)
  light1.position.set(Math.sin(time * 1.5) * 3, Math.cos(time * 1.0) * 2, Math.sin(time) * 2);
  light2.position.set(Math.cos(time * 1.3) * 2.5, Math.sin(time * 0.8) * 2, Math.cos(time) * 2);
  light3.position.set(Math.sin(time * 1.1) * 2, Math.cos(time * 1.2) * 2, Math.sin(time * 0.5) * 3);

  controls.update();
  renderer.render(scene, camera);
}
</script>

</body>
</html>
