<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>3D Model Viewer mit Licht & Material</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="three.js"></script>
    <script src="Detector.js"></script>
    <script src="OrbitControls.js"></script>
    <script src="OBJLoader.js"></script>

    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden; background: #111;
            touch-action: none;
        }
        canvas { display: block; }
    </style>
</head>
<body>
<script>
    if (!Detector.webgl) Detector.addGetWebGLMessage();

    let container, camera, controls, scene, renderer;

    init();
    animate();

    function init() {
        container = document.createElement('div');
        document.body.appendChild(container);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1, 3);

        scene = new THREE.Scene();

        // Licht: DirectionalLight mit Schatten
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 7);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 1024;
        directionalLight.shadow.mapSize.height = 1024;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 50;
        scene.add(directionalLight);

        // Optional: Schattenkamera sichtbar machen (debug)
        // const helper = new THREE.CameraHelper(directionalLight.shadow.camera);
        // scene.add(helper);

        // Boden für Schattenempfang
        const groundGeo = new THREE.PlaneGeometry(20, 20);
        const groundMat = new THREE.ShadowMaterial({opacity: 0.3});
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = - Math.PI / 2;
        ground.position.y = -0.5;
        ground.receiveShadow = true;
        scene.add(ground);

        // Modell laden
        const loader = new THREE.OBJLoader();
        loader.setPath('assets/');
        loader.load('model.obj', function(object) {
            object.traverse(function(child) {
                if(child.isMesh) {
                    child.material = new THREE.MeshStandardMaterial({
                        color: 0xdddddd,
                        metalness: 0.3,
                        roughness: 0.7
                    });
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            scene.add(object);
        });

        // Renderer mit Schatten aktivieren
        renderer = new THREE.WebGLRenderer({antialias:true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Controls
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.enableZoom = true;
        controls.minDistance = 0.5;
        controls.maxDistance = 10;

        window.addEventListener('resize', onWindowResize, false);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
