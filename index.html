<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>WebGL 3D Model Viewer Using three.js</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Script dependencies -->
    <script src="three.js"></script>
    <script src="Detector.js"></script>
    <script src="OrbitControls.js"></script>
    <script src="OBJLoader.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #111;
            touch-action: none; /* erlaubt Mobil-Gesten (Zoom, Rotate, Pan) */
        }
    </style>
</head>
<body>

<script>
    if (!Detector.webgl) {
        Detector.addGetWebGLMessage();
    }

    let container, camera, controls, scene, renderer;

    init();
    animate();

    function init() {
        container = document.createElement('div');
        document.body.appendChild(container);

        // Kamera
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 3;

        // Szene
        scene = new THREE.Scene();

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);

        // Modell laden
        const loader = new THREE.OBJLoader();
        loader.setPath('assets/');
        loader.load('model.obj', function (object) {
            scene.add(object);
        });

        // Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Steuerung
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.enableZoom = true;              // Zoom aktivieren
        controls.minDistance = 0.5;              // Optional: nahester Zoom
        controls.maxDistance = 10;               // Optional: weitester Zoom

        // Events
        window.addEventListener('resize', onWindowResize, false);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
</script>

</body>
</html>
