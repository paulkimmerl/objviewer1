<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>3D Model Viewer mit Schatten und PBR Material</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body, html { margin: 0; height: 100%; overflow: hidden; background: #111; }
    canvas { display: block; }
  </style>

  <!-- Drei.js und Loader -->
  <script src="three.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="OBJLoader.js"></script>
</head>
<body>
<script>
  // Szene, Kamera, Renderer
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 1.5, 3);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true; // Schatten aktivieren
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // Licht
  const directionalLight = new THREE.DirectionalLight(0xffffff, 0.3);
  directionalLight.position.set(5, 10, 5);
  directionalLight.castShadow = true;
  directionalLight.shadow.camera.near = 0.5;
  directionalLight.shadow.camera.far = 20;
  directionalLight.shadow.mapSize.width = 1024;
  directionalLight.shadow.mapSize.height = 1024;
  scene.add(directionalLight);

  // Ambient Light sehr schwach, nur um dunkle Schatten etwas zu erhellen
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
  scene.add(ambientLight);

  // Boden für Schattenempfang
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(20, 20),
    new THREE.ShadowMaterial({ opacity: 0.4 })
  );
  ground.rotation.x = - Math.PI / 2;
  ground.position.y = -0.5;
  ground.receiveShadow = true;
  scene.add(ground);

  // Steuerung
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.enableZoom = true;
  controls.minDistance = 1;
  controls.maxDistance = 10;

  // Modell laden
  const loader = new THREE.OBJLoader();
  loader.setPath('assets/');
  loader.load('model.obj', function(object) {
    object.traverse(function(child) {
      if(child.isMesh) {
        // Material mit Licht- und Schattenreaktion
        child.material = new THREE.MeshStandardMaterial({
          color: 0xdddddd,
          metalness: 0.3,
          roughness: 0.7
        });
        child.castShadow = true;
        child.receiveShadow = true;

        // Falls das Modell keine Normalen hat
        if (!child.geometry.hasAttribute('normal')) {
          child.geometry.computeVertexNormals();
        }
      }
    });
    scene.add(object);
  });

  // Fenster-Resize
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Animation Loop
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
