<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>3D Viewer – Dezente Wanderlichter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="three.js"></script>
  <script src="Detector.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="OBJLoader.js"></script>
  <div id="blur-overlay"></div>
  <link rel="stylesheet" href="overlay.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111;
      touch-action: none;
    }
  </style>
</head>
<body>

<script>
if (!Detector.webgl) Detector.addGetWebGLMessage();

let container, camera, controls, scene, renderer;
let light1, light2, light3;
let time = 0;

init();
animate();

function init() {
  container = document.createElement('div');
  document.body.appendChild(container);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 7;

  scene = new THREE.Scene();

  // Gedimmte weiße wandernde Punktlichter
  light1 = new THREE.PointLight(0xffffff, 0.8, 10);  // Heller als vorher
  light2 = new THREE.PointLight(0xffffff, 0.15, 10);
  light3 = new THREE.PointLight(0xffffff, 0.05, 10); // Startwert sehr gedimmt

  scene.add(light1);
  scene.add(light2);
  scene.add(light3);

  // Modell laden
  const loader = new THREE.OBJLoader();
  loader.setPath('assets/');
  loader.load('model.obj', function (object) {
    scene.add(object);
  });

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  // Steuerung
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.1;
  controls.enableZoom = true;

  window.addEventListener('resize', onWindowResize, false);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  time += 0.01;

  // light1 etwas heller und bewegt sich
  light1.intensity = 0.8;
  light1.position.set(Math.sin(time * 1.5) * 1.5, Math.cos(time * 1.0) * 1.5, Math.sin(time) * 1.5);

  // light2 normal
  light2.intensity = 0.15;
  light2.position.set(Math.cos(time * 1.3) * 1.2, Math.sin(time * 0.8) * 1.5, Math.cos(time) * 1.2);

  // Strobo light3 mit random Blink
  if (Math.random() < 0.01 && light3.intensity < 0.05) {
    light3.intensity = 1.0; // Blitz starten
  } else {
    light3.intensity *= 0.95; // sanft dimmen
    if (light3.intensity < 0.05) light3.intensity = 0.05; // Mindesthelligkeit
  }
  light3.position.set(Math.sin(time * 1.1) * 1.0, Math.cos(time * 1.2) * 1.0, Math.sin(time * 0.5) * 1.5);

  controls.update();
  renderer.render(scene, camera);
}
</script>

</body>
</html>
