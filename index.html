<!DOCTYPE html>
<html>
<head>
  <title>Three.js OBJ Viewer mit Touch Zoom</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <style>
    body {
      margin: 0; overflow: hidden;
      background: hsl(0,0%,10%);
      touch-action: none; /* Wichtig: erlaubt Touch Events für Zoom, Dreh */
    }
  </style>
</head>
<body>
  <script src="three.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="OBJLoader.js"></script>
  <script>
    let container, camera, scene, renderer, controls;

    init();
    animate();

    function init() {
      container = document.createElement('div');
      document.body.appendChild(container);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.5, 3);

      scene = new THREE.Scene();

      renderer = new THREE.WebGLRenderer({antialias:true});
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(new THREE.Color('hsl(0,0%,10%)'));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // Controls mit Zoom und Touch-Gesten
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.25;
      controls.enableZoom = true;
      controls.minDistance = 0.5;
      controls.maxDistance = 10;

      // Licht
      let ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
      scene.add(ambientLight);

      let directionalLight = new THREE.DirectionalLight(0xffffff, 1);
      directionalLight.position.set(5, 10, 7.5);
      directionalLight.castShadow = true;
      scene.add(directionalLight);

      // Boden für Schatten
      let groundGeo = new THREE.PlaneGeometry(10,10);
      let groundMat = new THREE.ShadowMaterial({opacity: 0.4});
      let ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI/2;
      ground.position.y = 0;
      ground.receiveShadow = true;
      scene.add(ground);

      // Modell laden
      let loader = new THREE.OBJLoader();
      loader.setPath('assets/');
      loader.load('model.obj', function(object){
        object.traverse(function(child){
          if(child.isMesh){
            child.material = new THREE.MeshStandardMaterial({
              color: 0xffffff,
              metalness: 0.5,
              roughness: 0.5
            });
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
        object.position.y = 0.1;
        scene.add(object);
      });

      window.addEventListener('resize', onWindowResize, false);
    }

    function onWindowResize(){
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate(){
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene,camera);
    }
  </script>
</body>
</html>
